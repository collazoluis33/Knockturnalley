<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knockturn Alley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --ink: #1c1b19;
    --muted: #8a867d;
    --line: #dedad1;
    --menu-bg: #fbfaf7;
    --serif: "Cormorant Garamond", "EB Garamond", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --ink: #e9e6df;
      --muted: #85827b;
      --line: #2c2b28;
      --menu-bg: #1b1b19;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  /* ---------- Home ---------- */
  #home {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2.4rem;
    transition: opacity .9s ease;
  }
  #home h1 {
    font-weight: 400;
    font-style: italic;
    font-size: clamp(2.6rem, 6vw, 4rem);
    letter-spacing: .01em;
  }
  #enter {
    font-family: var(--sans);
    font-weight: 300;
    font-size: .72rem;
    letter-spacing: .38em;
    text-transform: lowercase;
    color: var(--muted);
    padding: .6rem 0 .6rem .38em;
    border-bottom: 1px solid transparent;
    transition: color .4s ease, border-color .4s ease;
    animation: breathe 3.6s ease-in-out infinite;
  }
  #enter:hover, #enter:focus-visible { color: var(--ink); border-color: var(--ink); animation: none; outline: none; }
  #enter.gone { opacity: 0 !important; pointer-events: none; animation: none; transition: opacity .5s ease; }
  #gate {
    position: absolute; top: calc(50% + 2.2rem);
    display: flex; flex-direction: column; align-items: center; gap: 1rem;
    opacity: 0; visibility: hidden; transform: translateY(6px);
    transition: opacity .6s ease .2s, transform .6s ease .2s, visibility .6s;
  }
  #gate.show { opacity: 1; visibility: visible; transform: none; }
  #pw {
    width: min(20rem, 78vw);
    background: transparent; border: 0; border-bottom: 1px solid var(--line);
    color: var(--ink); text-align: center;
    font-family: var(--serif); font-style: italic; font-size: 1.2rem;
    padding: .4rem 0; outline: none; border-radius: 0;
    transition: border-color .3s ease;
  }
  #pw:focus { border-color: var(--muted); }
  #pw::placeholder { color: var(--muted); opacity: .7; font-family: var(--sans); font-style: normal; font-weight: 300; font-size: .72rem; letter-spacing: .3em; }
  #msg { min-height: 1em; font-family: var(--sans); font-weight: 300; font-size: .68rem; letter-spacing: .25em; color: var(--muted); text-transform: lowercase; }
  #gate.shake #pw { animation: shake .4s ease; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  /* ---------- Header ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center;
    padding: 1.6rem clamp(1.4rem, 4vw, 3rem);
    font-family: var(--sans);
    font-weight: 300;
    font-size: .72rem;
    letter-spacing: .22em;
    text-transform: lowercase;
    background: linear-gradient(var(--bg) 60%, transparent);
    z-index: 10;
  }
  .menu { position: relative; }
  .menu-toggle { display: flex; align-items: center; gap: .6em; letter-spacing: .22em; font-size: .72rem; font-weight: 300; font-family: var(--sans); }
  .menu-toggle .chev { display: inline-block; width: .5em; height: .5em; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform .3s ease; }
  .menu.open .chev { transform: translateY(1px) rotate(225deg); }
  .menu-list {
    position: absolute; left: 50%; top: calc(100% + .9rem);
    min-width: 13rem;
    max-height: min(70vh, 34rem);
    overflow-y: auto;
    background: var(--menu-bg);
    border: 1px solid var(--line);
    padding: .7rem 0;
    list-style: none;
    opacity: 0; visibility: hidden; transform: translate(-50%, -6px);
    text-align: center;
    transition: opacity .25s ease, transform .25s ease, visibility .25s;
  }
  .menu.open .menu-list { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
  .menu-list a {
    display: block;
    padding: .5rem 1.3rem;
    font-family: var(--serif);
    font-size: 1.05rem;
    letter-spacing: .01em;
    text-transform: none;
    color: var(--muted);
    transition: color .2s;
  }
  .menu-list a:hover, .menu-list a:focus-visible { color: var(--ink); outline: none; }
  .menu-list a.current { color: var(--ink); font-style: italic; }

  /* ---------- Poem ---------- */
  #reader { display: none; min-height: 100%; }
  main {
    max-width: 34rem;
    margin: 0 auto;
    padding: clamp(8rem, 18vh, 11rem) 1.6rem 6rem;
    transition: opacity .5s ease, transform .5s ease;
  }
  main.fade { opacity: 0; transform: translateY(6px); }
  .num {
    font-family: var(--sans);
    font-weight: 300;
    font-size: .68rem;
    letter-spacing: .3em;
    color: var(--muted);
    margin-bottom: 1.4rem;
  }
  h2 {
    font-weight: 400;
    font-style: italic;
    font-size: clamp(2rem, 5vw, 2.6rem);
    line-height: 1.15;
    margin-bottom: .6rem;
  }
  .sub { font-style: italic; color: var(--muted); font-size: 1.05rem; margin-top: .2rem; }
  .rule { width: 2.2rem; height: 1px; background: var(--ink); opacity: .35; margin: 2.2rem 0 2.4rem; }
  .stanza { margin-bottom: 1.7em; }
  .stanza p {
    font-size: clamp(1.18rem, 2.4vw, 1.32rem);
    line-height: 1.62;
    padding-left: 1.4em;
    text-indent: -1.4em;
  }

  nav.pager {
    display: flex; justify-content: space-between; gap: 1rem;
    margin-top: 5rem; padding-top: 1.6rem;
    border-top: 1px solid var(--line);
    font-family: var(--sans); font-weight: 300;
    font-size: .68rem; letter-spacing: .2em; text-transform: lowercase;
  }
  nav.pager a { color: var(--muted); transition: color .3s; max-width: 48%; }
  nav.pager a:hover { color: var(--ink); }
  nav.pager a span { display: block; font-family: var(--serif); font-style: italic; font-size: 1.05rem; letter-spacing: .01em; text-transform: none; margin-top: .35rem; color: var(--ink); }
  nav.pager .next { text-align: right; margin-left: auto; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<section id="home">
  <h1>Knockturn Alley</h1>
  <button id="enter" type="button">click to enter</button>
  <form id="gate" autocomplete="off">
    <input id="pw" type="password" placeholder="password" aria-label="Password" autocomplete="current-password" spellcheck="false">
    <p id="msg" aria-live="polite"></p>
  </form>
</section>

<div id="reader">
  <header>
    <div class="menu" id="menu">
      <button class="menu-toggle" id="menuToggle" type="button" aria-haspopup="true" aria-expanded="false">poems <span class="chev"></span></button>
      <ul class="menu-list" id="menuList" role="menu"></ul>
    </div>
  </header>
  <main id="poem"></main>
</div>

const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
let POEMS = [];
function loadPoems(raw) {
  POEMS = raw.map(([title, sub, body]) => ({
    title, sub, slug: slugify(title),
    stanzas: body.trim().split(/\n\s*\n/).map(s => s.split("\n"))
  }));
  list.innerHTML = POEMS.map(p => `<li role="none"><a role="menuitem" href="#${p.slug}" data-slug="${p.slug}">${esc(p.title)}</a></li>`).join("");
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const home = document.getElementById("home");
const reader = document.getElementById("reader");
const main = document.getElementById("poem");
const menu = document.getElementById("menu");
const toggle = document.getElementById("menuToggle");
const list = document.getElementById("menuList");

function setMenu(open) {
  menu.classList.toggle("open", open);
  toggle.setAttribute("aria-expanded", open);
}
toggle.addEventListener("click", e => { e.stopPropagation(); setMenu(!menu.classList.contains("open")); });
document.addEventListener("click", e => { if (!menu.contains(e.target)) setMenu(false); });
list.addEventListener("click", () => setMenu(false));

function renderPoem(i) {
  const p = POEMS[i];
  const prev = POEMS[i - 1], next = POEMS[i + 1];
  const html = `
    <div class="num">${String(i + 1).padStart(2, "0")} / ${String(POEMS.length).padStart(2, "0")}</div>
    <h2>${esc(p.title)}</h2>
    ${p.sub ? `<div class="sub">${esc(p.sub)}</div>` : ""}
    <div class="rule"></div>
    ${p.stanzas.map(s => `<div class="stanza">${s.map(l => `<p>${esc(l)}</p>`).join("")}</div>`).join("")}
    <nav class="pager">
      ${prev ? `<a class="prev" href="#${prev.slug}">previous<span>${esc(prev.title)}</span></a>` : ""}
      ${next ? `<a class="next" href="#${next.slug}">next<span>${esc(next.title)}</span></a>` : ""}
    </nav>`;
  main.classList.add("fade");
  setTimeout(() => {
    main.innerHTML = html;
    window.scrollTo(0, 0);
    requestAnimationFrame(() => main.classList.remove("fade"));
  }, main.innerHTML ? 260 : 0);
  document.title = `${p.title} · Knockturn Alley`;
  list.querySelectorAll("a").forEach(a => a.classList.toggle("current", a.dataset.slug === p.slug));
}

let current = -1;
function route() {
  const slug = location.hash.replace(/^#/, "");
  const i = POEMS.findIndex(p => p.slug === slug);
  setMenu(false);
  if (!POEMS.length) {
    pending = slug;
    reader.style.display = "none";
    home.style.display = "flex";
    home.style.opacity = 1;
    if (slug) openGate();
    return;
  }
  if (i === -1) {
    current = -1;
    reader.style.display = "none";
    home.style.display = "flex";
    requestAnimationFrame(() => home.style.opacity = 1);
    main.innerHTML = "";
    document.title = "Knockturn Alley";
    enterBtn.classList.remove("gone");
    gate.classList.remove("show");
    return;
  }
  home.style.display = "none";
  reader.style.display = "block";
  current = i;
  renderPoem(i);
}

const enterBtn = document.getElementById("enter");
const gate = document.getElementById("gate");
const pw = document.getElementById("pw");
const msg = document.getElementById("msg");
let pending = "";

function goIn() {
  home.style.opacity = 0;
  const target = POEMS.find(p => p.slug === pending) ? pending : POEMS[0].slug;
  pending = "";
  setTimeout(() => {
    if (location.hash.replace(/^#/, "") === target) route(); else location.hash = target;
  }, 700);
}
function openGate() {
  enterBtn.classList.add("gone");
  gate.classList.add("show");
  setTimeout(() => pw.focus(), 250);
}
enterBtn.addEventListener("click", () => { POEMS.length ? goIn() : openGate(); });

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const normalize = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
async function deriveKey(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(normalize(pass)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(VAULT.salt), iterations: VAULT.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function openVault(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(VAULT.iv) }, key, b64(VAULT.data));
  loadPoems(JSON.parse(new TextDecoder().decode(plain)));
}
async function remember(key) {
  try {
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    sessionStorage.setItem("ka-key", btoa(String.fromCharCode(...raw)));
  } catch (e) {}
}
async function recall() {
  try {
    const k = sessionStorage.getItem("ka-key");
    if (!k) return false;
    const key = await crypto.subtle.importKey("raw", b64(k), "AES-GCM", false, ["decrypt"]);
    await openVault(key);
    return true;
  } catch (e) { return false; }
}

gate.addEventListener("submit", async e => {
  e.preventDefault();
  if (!pw.value.trim()) return;
  if (!window.crypto || !crypto.subtle) { msg.textContent = "please open this site over https"; return; }
  msg.textContent = "…";
  try {
    const key = await deriveKey(pw.value);
    await openVault(key);
    await remember(key);
    msg.textContent = "";
    pw.blur();
    goIn();
  } catch (err) {
    msg.textContent = "mischief not managed";
    pw.value = "";
    gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") setMenu(false);
  if (current === -1) {
    if (e.key === "Enter" && document.activeElement === document.body) document.getElementById("enter").click();
    return;
  }
  if (e.key === "ArrowRight" && POEMS[current + 1]) location.hash = POEMS[current + 1].slug;
  if (e.key === "ArrowLeft" && POEMS[current - 1]) location.hash = POEMS[current - 1].slug;
});

window.addEventListener("hashchange", route);
(async () => { if (window.crypto && crypto.subtle) await recall(); route(); })();
</script>
